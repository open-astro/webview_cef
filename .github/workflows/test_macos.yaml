name: Test if the example app still builds on macOS
# pull_request-only for now: building on `main` needs the CEF 130 / SPM work
# (macos/setup_cef.sh, Package.swift) that lands via the feature PR. Add a
# push trigger once that has merged.
on:
  pull_request:
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"

jobs:
  main:
    # Apple Silicon runner — matches the arm64 CEF build setup_cef.sh fetches.
    runs-on: macos-14
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: cmake --version
      # Downloads CEF 130, builds libcef_dll_wrapper, versionizes the framework,
      # and wraps both as .xcframeworks (the binaries are git-ignored).
      - name: Fetch + stage CEF binaries
        run: ./macos/setup_cef.sh
      # Builds via Swift Package Manager (default on Flutter 3.44+); this is the
      # path that exercises Package.swift + the CEF binary targets.
      - name: Build example (macOS)
        run: cd example && flutter build macos --debug
