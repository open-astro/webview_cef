name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# Cancel an in-progress review if a newer commit is pushed to the same PR,
# so rapid pushes don't stack up redundant reviews (saves usage).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip Dependabot PRs: GitHub runs them with an isolated token that has no
    # access to the CLAUDE_CODE_OAUTH_TOKEN secret, so the action's token
    # exchange 401s and the check shows red.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16  # v1
        with:
          # Subscription (Pro/Max) auth. Generate locally with `claude setup-token`
          # and store as an org or repo secret named CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request. The PR branch is already
            checked out in the current working directory. This is a Flutter
            desktop plugin wrapping CEF (Chromium Embedded Framework) for
            Windows / macOS / Linux, with native C++/Objective-C++ and Dart.

            Focus ONLY on genuinely important issues, in these categories:
            - Potential bugs or logic errors
            - Correctness (incl. native/Dart FFI + platform-channel boundaries)
            - Security implications
            - Performance considerations

            Rules:
            - Be concise. Use short bullet points.
            - Skip minor style/formatting nitpicks (a linter/clang-format handles those).
            - If you find no significant issues, say so briefly.

            Submit your verdict as a FORMAL pull-request review (NOT a plain
            comment) so it satisfies branch protection's required-review gate.
            Run EXACTLY ONE of these, with PR NUMBER ${{ github.event.pull_request.number }}:
            - No significant issues:
                gh pr review ${{ github.event.pull_request.number }} --approve --body "<concise summary>. ✅ Approved"
            - Issues to address:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<concise findings>. ⚠️ Issues found"
            Keep --body a single, concise, double-quoted string. Do NOT use a
            heredoc or $(...) command substitution (the sandbox blocks those).
            Do not submit the review text as a chat message.
          claude_args: |
            --model sonnet
            --allowedTools "Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
